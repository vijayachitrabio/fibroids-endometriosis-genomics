<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fibroids-Endometriosis Results Browser</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="bg-light">
    
    <!-- Navbar / Header -->
    <header class="navbar navbar-expand-lg navbar-dark shadow-sm py-3 mb-4" style="background-color: #d35400;">
      <div class="container-fluid px-4 align-items-center">
        <div class="navbar-brand mb-0 me-4">
          <h1 class="h4 mb-0 fw-bold" style="font-family: 'Outfit', sans-serif;">Fibroids-Endometriosis Browser</h1>
        </div>
        <div class="collapse navbar-collapse d-flex justify-content-between">
          <ul id="tabs" class="navbar-nav me-auto mb-2 mb-lg-0 gap-1" aria-label="Analysis tabs"></ul>
          <div class="d-flex align-items-center ms-3">
            <span class="badge bg-white bg-opacity-25 text-white p-2">
              <strong id="updatedStamp" class="d-block text-white fw-normal">Updated</strong>
            </span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <div class="container-fluid px-4 mb-5">
      <!-- Application View injected by app.js -->
      <main id="app" tabindex="-1"></main>
    </div>

    <footer class="bg-white border-top py-4 mt-auto">
      <div class="container-fluid px-4 d-flex justify-content-between text-muted small">
        <span>No UK Biobank individual-level data are included.</span>
        <span>Static HTML/CSS/JS for GitHub Pages.</span>
      </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="app.js"></script>
  </body>
</html>
